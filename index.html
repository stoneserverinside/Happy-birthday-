<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎈</title>
    <style>
        body {
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Birthday Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 10;
            border: 5px solid #fff;
        }

        h1 { color: #ff4081; font-size: 3rem; margin: 0; animation: glow 1s ease-in-out infinite alternate; }
        .name { color: #3f51b5; font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        .cake { font-size: 80px; margin: 20px 0; }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #ff4081; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #ff80ab; }
        }

        /* Balloons Animation */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 50px;
            height: 70px;
            background: #ff4081;
            border-radius: 50%;
            animation: float 8s linear infinite;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }

        .btn {
            background: #ff4081; color: white; border: none; padding: 12px 30px;
            border-radius: 50px; font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: scale(1.1); background: #d81b60; }
    </style>
</head>
<body>

    <div class="balloon" style="left: 10%; background: #ff4081; animation-delay: 0s;"></div>
    <div class="balloon" style="left: 30%; background: #ffeb3b; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 55%; background: #4caf50; animation-delay: 4s;"></div>
    <div class="balloon" style="left: 80%; background: #2196f3; animation-delay: 1s;"></div>
    <div class="balloon" style="left: 90%; background: #9c27b0; animation-delay: 3s;"></div>

    <div class="card">
        <h1>Happy Birthday!</h1>
        <div class="name">Aman! 🎂</div>
        <p style="font-size: 1.2rem; color: #555;">Duniya ki saari khushiyan aapko milein!</p>
        <button class="btn" onclick="alert('🥳 Party toh banti hai!')">Surprise Click!</button>
    </div>

</body>
</html>
