<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman's Special Birthday Menu 🎂</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 { font-size: 2.5rem; margin-bottom: 30px; color: #00d2ff; text-shadow: 0 0 10px #00d2ff; }

        .btn-menu {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .btn-wish { background: #ff4081; box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4); }
        .btn-shayari { background: #4caf50; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); }
        .btn-music { background: #2196f3; box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4); }

        .btn-menu:hover { transform: scale(1.05); filter: brightness(1.2); }

        /* Shayari Box Style */
        #shayariBox {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(to bottom, #ffffff, #fce4ec);
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 20;
            width: 85%;
            max-width: 450px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #shayariBox p {
            font-size: 1.1rem;
            line-height: 1.8;
            font-weight: 500;
            color: #d81b60;
        }

        .close-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 55px;
            border-radius: 50%;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            to { transform: translateY(-110vh) rotate(20deg); }
        }
    </style>
</head>
<body>

    <audio id="mySong" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>Aman's Special Day 🎁</h1>
        
        <button class="btn-wish btn-menu" onclick="showBalloons()">1. Surprise Wish 🎈</button>
        <button class="btn-shayari btn-menu" onclick="showShayari()">2. Special Shayari ✍️</button>
        <button class="btn-music btn-menu" id="musicBtn" onclick="toggleMusic()">3. Play Music 🎵</button>
    </div>

    <div id="shayariBox">
        <h2 style="color: #3f51b5;">For You Aman! 🌹</h2>
        <p>
            मत मुस्कुराओ इतना की फूलों को खबर लग जाये,🌹🌿🌹<br>
            हम करें आपकी तारीफ और आपको नजर लग जाये🌹🌿🌹<br>
            खुदा करे बहुत लम्बी हो आपकी जिंदगी 🦋🤗<br>
            और उस पर भी हमारी उम्र लग जाये….🌹🌿🌹<br><br>
            <strong>🍬🎂 हैप्पी बर्थडे AMAN सदा हँसती रहना…🎂</strong>
        </p>
        <button class="close-btn" onclick="document.getElementById('shayariBox').style.display='none'">Dil Se Shukriya ❤️</button>
    </div>

    <script>
        function showBalloons() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            for(let i=0; i<20; i++) {
                let b = document.createElement('div');
                b.className = 'balloon';
                b.style.left = Math.random() * 100 + 'vw';
                b.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
                b.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(b);
            }
        }

        function showShayari() {
            document.getElementById('shayariBox').style.display = 'block';
            // Shayari khulne par bhi thoda sa confetti blast
            confetti({ particleCount: 50, spread: 50, origin: { y: 0.8 } });
        }

        let isPlaying = false;
        let song = document.getElementById("mySong");
        let btn = document.getElementById("musicBtn");

        function toggleMusic() {
            if (isPlaying) {
                song.pause();
                btn.innerHTML = "3. Play Music 🎵";
                btn.style.background = "#2196f3";
            } else {
                song.play();
                btn.innerHTML = "3. Pause Music ⏸️";
                btn.style.background = "#f44336";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
