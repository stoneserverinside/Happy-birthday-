<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Birthday Wish! ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            z-index: 10;
            animation: fadeIn 2s ease-in;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, #ff4081, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite alternate;
        }

        .name-box {
            font-size: 2.5rem;
            color: #00d2ff;
            font-weight: bold;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .btn-surprise {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(255, 64, 129, 0.4);
            transition: transform 0.3s;
        }

        .btn-surprise:hover {
            transform: scale(1.1);
        }

        /* Background Stars */
        .light { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle 2s infinite; }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #ff4081); }
            to { filter: drop-shadow(0 0 20px #00d2ff); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.5); opacity: 1; } }
    </style>
</head>
<body>

    <audio id="bdaySong" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>HAPPY BIRTHDAY</h1>
        <div class="name-box">AMAN!</div>
        <p style="opacity: 0.8;">Click karein aur magic dekhein!</p>
        <button class="btn-surprise" onclick="startMagic()">MAGIC CLICK 🎵✨</button>
    </div>

    <script>
        // Automatic Stars Generation
        for (let i = 0; i < 100; i++) {
            let star = document.createElement('div');
            star.className = 'light';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(star);
        }

        function startMagic() {
            // 1. Play Music
            var audio = document.getElementById("bdaySong");
            audio.play().catch(function(error) {
                console.log("Audio play failed:", error);
            });

            // 2. Confetti Blast
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });

            // 3. Theme Change
            document.body.style.background = "linear-gradient(to right, #6a11cb, #2575fc)";

            // 4. Message
            setTimeout(() => {
                alert("🎁 Music ON ho chuka hai! Happy Birthday Aman! 🥳");
            }, 600);
        }
    </script>
</body>
</html>
