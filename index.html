<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday SHABEENA! 🎂</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85%;
            max-width: 400px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff4081;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
        }

        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #00d2ff; }

        .btn-menu {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            z-index: 15;
        }

        .btn-wish { background: #ff4081; }
        .btn-shayari { background: #4caf50; }
        .btn-music { background: #2196f3; }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 50px;
            height: 70px;
            border-radius: 50%;
            z-index: 1;
            animation: floatUp 7s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-130vh) rotate(30deg); opacity: 0; }
        }

        #shayariBox {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            z-index: 100;
            width: 85%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <audio id="mySong" loop>
        <source src="song.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <img src="https://i.ibb.co/kvGBjWb/20260418-055201.jpg" alt="Sameer" class="profile-pic">
        <h1>Happy Birthday SHABEENA! 🎁</h1>
        <button class="btn-wish btn-menu" onclick="startCelebration()">1. Surprise Wish 🎈</button>
        <button class="btn-shayari btn-menu" onclick="showShayari()">2. Special Shayari ✍️</button>
        <button class="btn-music btn-menu" id="musicBtn" onclick="toggleMusic()">3. Play Music 🎵</button>
    </div>

    <div id="shayariBox">
        <h2 style="color: #3f51b5; margin-top: 0;">For You SHABEENA! 🌹</h2>
        <p style="font-size: 1rem; line-height: 1.6;">
            मत मुस्कुराओ इतना की फूलों को खबर लग जाये,🌹🌿🌹<br>
            हम करें आपकी तारीफ और आपको नजर लग जाये🌹🌿🌹<br>
            खुदा करे बहुत लम्बी हो आपकी जिंदगी 🦋🤗<br>
            और उस पर भी हमारी उम्र लग जाये….🌹🌿🌹<br><br>
            <strong>🍬🎂 हैप्पी बर्थडे Shabeena सदा हँसते रहना…🎂</strong>
        </p>
        <button style="background:#333; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;" onclick="document.getElementById('shayariBox').style.display='none'">Dil Se Shukriya ❤️</button>
    </div>

    <script>
        function startCelebration() {
            // Confetti
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 200 });

            // Balloons
            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    let balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    let colors = ['#ff4081', '#00d2ff', '#4caf50', '#ffeb3b', '#e91e63'];
                    balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
                    balloon.style.left = (Math.random() * 95) + 'vw';
                    document.body.appendChild(balloon);
                    setTimeout(() => { balloon.remove(); }, 8000);
                }, i * 300);
            }
        }

        function showShayari() {
            document.getElementById('shayariBox').style.display = 'block';
            confetti({ particleCount: 50, colors: ['#ff4081', '#4caf50'] });
        }

        let isPlaying = false;
        let song = document.getElementById("mySong");
        function toggleMusic() {
            if (isPlaying) {
                song.pause();
                document.getElementById("musicBtn").innerHTML = "3. Play Music 🎵";
            } else {
                song.play();
                document.getElementById("musicBtn").innerHTML = "3. Pause Music ⏸️";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
