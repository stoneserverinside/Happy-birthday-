<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sameer! 🎂</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 85%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .profile-pic {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 6px solid #ff4081;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.5); }

        .btn-menu {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .btn-wish { background: #ff4081; }
        .btn-shayari { background: #4caf50; }
        .btn-music { background: #2196f3; }

        .btn-menu:hover { transform: translateY(-3px); filter: brightness(1.2); }

        #shayariBox {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 30;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        /* Balloon Class */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 55px;
            border-radius: 50%;
            z-index: 1;
            animation: floatUp 6s linear forwards;
        }
        @keyframes floatUp {
            to { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="mySong" loop>
        <source src="song.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <img src="https://i.ibb.co/h3kmVcr/af40a3bf2f901b3432497787ebfe8747.jpg" alt="Sameer" class="profile-pic">
        <h1>Happy Birthday Sameer! 🎁</h1>
        <button class="btn-wish btn-menu" onclick="startCelebration()">1. Surprise Wish 🎈</button>
        <button class="btn-shayari btn-menu" onclick="showShayari()">2. Special Shayari ✍️</button>
        <button class="btn-music btn-menu" id="musicBtn" onclick="toggleMusic()">3. Play Music 🎵</button>
    </div>

    <div id="shayariBox">
        <h2 style="color: #3f51b5;">For You Sameer! 🌹</h2>
        <p>
            मत मुस्कुराओ इतना की फूलों को खबर लग जाये,🌹🌿🌹<br>
            हम करें आपकी तारीफ और आपको नजर लग जाये🌹🌿🌹<br>
            खुदा करे बहुत लम्बी हो आपकी जिंदगी 🦋🤗<br>
            और उस पर भी हमारी उम्र लग जाये….🌹🌿🌹<br><br>
            <strong>🍬🎂 हैप्पी बर्थडे SAMEER सदा हँसते रहना…🎂</strong>
        </p>
        <button style="background:#333; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;" onclick="document.getElementById('shayariBox').style.display='none'">Dil Se Shukriya ❤️</button>
    </div>

    <script>
        function startCelebration() {
            // Confetti Blast
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Balloons Animation
            for(let i=0; i<20; i++) {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                let colors = ['#ff4081', '#00d2ff', '#4caf50', '#ffeb3b', '#9c27b0'];
                balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(balloon);
                
                // Remove balloon after animation
                setTimeout(() => { balloon.remove(); }, 8000);
            }
        }

        function showShayari() {
            document.getElementById('shayariBox').style.display = 'block';
            confetti({ particleCount: 50, colors: ['#ff4081', '#00d2ff'] });
        }

        let isPlaying = false;
        let song = document.getElementById("mySong");
        function toggleMusic() {
            if (isPlaying) {
                song.pause();
                document.getElementById("musicBtn").innerHTML = "3. Play Music 🎵";
            } else {
                song.play();
                document.getElementById("musicBtn").innerHTML = "3. Pause Music ⏸️";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
